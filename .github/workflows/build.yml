name: Build dylib

on:
  push:
    paths: ["FixImageContext/**", "MemGuard/**", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fishhook
        working-directory: FixImageContext
        run: |
          curl -fsSL -O https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c
          curl -fsSL -O https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h

      - name: Build FixImageContext
        working-directory: FixImageContext
        run: make

      - name: Build MemGuard
        working-directory: MemGuard
        run: make

      - name: Check
        run: |
          file FixImageContext/FixImageContext.dylib MemGuard/MemGuard.dylib
          lipo -info MemGuard/MemGuard.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: tweaks
          path: |
            FixImageContext/FixImageContext.dylib
            MemGuard/MemGuard.dylib
